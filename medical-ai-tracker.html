<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical AI Engineer — 6-Month Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --bg2: #141720;
    --bg3: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0;
    --muted: #7a8099;
    --accent: #5b7cff;
    --accent2: #7b5fff;
    --green: #3ecf8e;
    --amber: #f5a623;
    --red: #ff6b6b;
    --pink: #e879a0;
    --font: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    font-family: var(--mono);
  }
  .overall-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
  }
  .overall-bar {
    flex: 1;
    height: 5px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
  }
  .overall-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.6s ease;
  }
  .overall-pct {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }

  /* ── Layout ── */
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ── Stats row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .stat-value span { font-size: 12px; color: var(--muted); }

  /* ── Phase card ── */
  .phase {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .phase:hover { border-color: var(--border2); }
  .phase.active { border-color: rgba(91, 124, 255, 0.35); }

  .phase-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    user-select: none;
  }
  .phase-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
    border: 1.5px solid;
  }
  .phase-meta { flex: 1; }
  .phase-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .phase-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .phase-progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
  }
  .phase-bar {
    flex: 1;
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .phase-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .phase-pct {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-width: 28px;
    text-align: right;
  }
  .phase-toggle {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.25s;
  }
  .phase-toggle.open { transform: rotate(180deg); }

  /* ── Phase body ── */
  .phase-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
  }
  .phase-body.open { display: block; }

  .month-goal {
    margin: 16px 0 14px;
    padding: 12px 14px;
    background: var(--bg3);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    border-left: 3px solid;
  }
  .month-goal strong { color: var(--text); }

  /* ── Week grid ── */
  .weeks {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .week {
    background: var(--bg3);
    border-radius: 10px;
    padding: 14px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .week:hover { border-color: var(--border2); }
  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .week-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .week-status {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 100px;
    font-family: var(--mono);
  }
  .week-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  /* ── Task items ── */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 5px 0;
    cursor: pointer;
  }
  .task:hover .task-text { color: var(--text); }
  .task-check {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--border2);
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.15s;
  }
  .task-check.checked {
    border-color: var(--green);
    background: var(--green);
  }
  .task-check.checked::after {
    content: '';
    width: 9px;
    height: 6px;
    border-left: 1.5px solid #0d0f12;
    border-bottom: 1.5px solid #0d0f12;
    transform: rotate(-45deg) translateY(-1px);
    display: block;
  }
  .task-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    transition: color 0.15s;
  }
  .task-text.done {
    text-decoration: line-through;
    opacity: 0.5;
  }

  /* ── Deliverable ── */
  .deliverable {
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid;
    margin-top: 4px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .deliverable-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .deliverable-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .deliverable-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ── Notes ── */
  .notes-section {
    margin-top: 14px;
  }
  .notes-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .notes-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    resize: vertical;
    min-height: 64px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }
  .notes-input:focus { border-color: var(--border2); }
  .notes-input::placeholder { color: var(--muted); opacity: 0.6; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 32px 24px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    border-top: 1px solid var(--border);
  }

  /* ── Completed badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 100px;
    font-family: var(--mono);
  }

  @media (max-width: 600px) {
    .container { padding: 16px; }
    .header { padding: 20px 16px 16px; }
    .weeks { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .phase-progress-wrap { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">🧬 Medical AI Engineer — 6-Month Tracker</div>
      <div class="header-sub">Full-Stack Breast Cancer AI Platform · hobby track</div>

</header>

<div class="container">

    </div>

  <div id="phases-container"></div>
</div>

<div class="footer">All progress saved to localStorage · refresh-safe · no account needed</div>

          'Implement: Monte Carlo Dropout for uncertainty quantification',

          'Build: risk stratification score (low/moderate/high) with clinical thresholds',
          'Implement: comparative study view (current vs prior exam)',
          'Add: batch inference endpoint for screening workflows'
        ]
      },
      {
        id: 'w23', label: 'Week 23', title: 'Platform Hardening',
        tasks: [
          'Write: end-to-end integration tests (Playwright for frontend)',
          'Run: load test with Locust — 20 concurrent users, 50 inferences/min',
          'Audit: OWASP top 10 checklist, fix any issues',
          'Write: DICOM conformance statement (what SOP classes you support)',
          'Fix: all critical bugs found, document known limitations'
        ]
      },
      {
        id: 'w24', label: 'Week 24', title: 'Portfolio Launch',
        tasks: [
          'Draw: C4 architecture diagram (Context, Container, Component)',
          'Write: comprehensive README with architecture, setup, and demo GIF',
          'Record: 5-minute screen walkthrough demo video',
          'Write: technical blog post — key design decisions and lessons learned',
          'Share: GitHub repo, LinkedIn post, medical AI communities'
        ]
      }
    ],
    deliverable: {
      icon: '🏥',
      title: 'Full-Stack Breast Cancer AI Platform',
      desc: 'Multi-modal AI: DICOM ingestion → segmentation + classification → EHR-integrated risk scoring → clinical dashboard → XAI → deployed on Azure with full MLOps. Your flagship portfolio piece.'
    }
  }
];

// ── State management ──
function loadState() {
  try { return JSON.parse(localStorage.getItem('medai_tracker') || '{}'); } catch { return {}; }
}
function saveState(state) {
  state._updated = new Date().toISOString();
  localStorage.setItem('medai_tracker', JSON.stringify(state));
}

let state = loadState();

// ── Rendering ──
function getWeekKey(phaseId, weekId) { return `p${phaseId}_${weekId}`; }
function getTaskKey(phaseId, weekId, taskIdx) { return `p${phaseId}_${weekId}_t${taskIdx}`; }
function getNoteKey(phaseId) { return `p${phaseId}_notes`; }

function countPhaseTasks(phase) {
  let total = 0, done = 0;
  phase.weeks.forEach(w => {
    w.tasks.forEach((_, i) => {
      total++;
      if (state[getTaskKey(phase.id, w.id, i)]) done++;
    });
  });
  return { total, done };
}

function countAll() {
  let total = 0, done = 0;
  PHASES.forEach(p => {
    const c = countPhaseTasks(p);
    total += c.total;
    done += c.done;
  });
  return { total, done };
}

function getWeeksStarted() {
  const started = new Set();
  Object.keys(state).forEach(k => {
    if (k.startsWith('p') && k.includes('_t') && state[k]) {
      const parts = k.split('_');
      started.add(parts[0] + '_' + parts[1]);
    }
  });
  return started.size;
}

function getCurrentPhase() {
  for (let i = PHASES.length - 1; i >= 0; i--) {
    const { done } = countPhaseTasks(PHASES[i]);
    if (done > 0) return PHASES[i];
  }
  return PHASES[0];
}

function updateStats() {
  const { total, done } = countAll();
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('overall-fill').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('stat-done').innerHTML = `${done} <span>/ ${total}</span>`;
  document.getElementById('stat-weeks').innerHTML = `${getWeeksStarted()} <span>/ 24</span>`;
  const cp = getCurrentPhase();
  document.getElementById('stat-phase').innerHTML = `${cp.id} <span>${cp.label}</span>`;
  const upd = state._updated;
  if (upd) {
    const d = new Date(upd);
    document.getElementById('stat-date').textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
}

function updatePhaseUI(phase) {
  const { total, done } = countPhaseTasks(phase);
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const fillEl = document.getElementById(`pf-${phase.id}`);
  const pctEl = document.getElementById(`pp-${phase.id}`);
  if (fillEl) fillEl.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
  const card = document.getElementById(`phase-${phase.id}`);
  if (card) card.classList.toggle('active', done > 0);
}

function toggleTask(phaseId, weekId, taskIdx) {
  const key = getTaskKey(phaseId, weekId, taskIdx);
  state[key] = !state[key];
  saveState(state);
  const check = document.getElementById(`chk-${key}`);
  const text = document.getElementById(`txt-${key}`);
  if (check) check.classList.toggle('checked', !!state[key]);
  if (text) text.classList.toggle('done', !!state[key]);
  const phase = PHASES.find(p => p.id === phaseId);
  if (phase) updatePhaseUI(phase);
  updateStats();
}

function saveNote(phaseId, val) {
  state[getNoteKey(phaseId)] = val;
  saveState(state);
}

function togglePhase(phaseId) {
  const body = document.getElementById(`pb-${phaseId}`);
  const chev = document.getElementById(`pc-${phaseId}`);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function renderPhase(phase) {
  const { total, done } = countPhaseTasks(phase);
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const isStarted = done > 0;

  const weeksHtml = phase.weeks.map(w => {
    const wDone = w.tasks.filter((_, i) => state[getTaskKey(phase.id, w.id, i)]).length;
    const wPct = Math.round((wDone / w.tasks.length) * 100);
    const statusColor = wPct === 100 ? 'color:var(--green)' : wPct > 0 ? 'color:var(--amber)' : 'color:var(--muted)';
    const statusText = wPct === 100 ? '✓ done' : wPct > 0 ? `${wPct}%` : 'not started';

    const tasksHtml = w.tasks.map((task, i) => {
      const key = getTaskKey(phase.id, w.id, i);
      const checked = !!state[key];
      return `
      <div class="task" onclick="toggleTask(${phase.id}, '${w.id}', ${i})">
        <div class="task-check ${checked ? 'checked' : ''}" id="chk-${key}"></div>
        <div class="task-text ${checked ? 'done' : ''}" id="txt-${key}">${task}</div>
      </div>`;
    }).join('');

    return `
    <div class="week">
      <div class="week-header">
        <div class="week-label">${w.label}</div>
        <div class="week-status" style="${statusColor};background:var(--bg);border:1px solid var(--border)">${statusText}</div>
      </div>
      <div class="week-title">${w.title}</div>
      ${tasksHtml}
    </div>`;
  }).join('');

  const noteVal = state[getNoteKey(phase.id)] || '';
  const delivColor = phase.color;

  return `
  <div class="phase ${isStarted ? 'active' : ''}" id="phase-${phase.id}">
    <div class="phase-header" onclick="togglePhase(${phase.id})">
      <div class="phase-dot" style="color:${delivColor};border-color:${delivColor};background:${delivColor}18">
        ${phase.id}
      </div>
      <div class="phase-meta">
        <div class="phase-name">
          <span style="color:var(--muted);font-weight:400;font-size:12px">${phase.label}</span>
          ${phase.name}
        </div>
        <div class="phase-sub">${phase.sub}</div>
      </div>
      <div class="phase-progress-wrap">
        <div class="phase-bar">
          <div class="phase-fill" id="pf-${phase.id}" style="width:${pct}%;background:${delivColor}"></div>
        </div>
        <div class="phase-pct" id="pp-${phase.id}">${pct}%</div>
      </div>
      <div class="phase-toggle" id="pc-${phase.id}">▾</div>
    </div>
    <div class="phase-body" id="pb-${phase.id}">
      <div class="month-goal" style="border-color:${delivColor}">${phase.goal}</div>
      <div class="weeks">${weeksHtml}</div>
      <div class="deliverable" style="background:${delivColor}0d;border-color:${delivColor}40">
        <div class="deliverable-icon">${phase.deliverable.icon}</div>
        <div>
          <div class="deliverable-title" style="color:${delivColor}">Monthly deliverable — ${phase.deliverable.title}</div>
          <div class="deliverable-desc">${phase.deliverable.desc}</div>
        </div>
      </div>
      <div class="notes-section">
        <div class="notes-label">Your notes for ${phase.label}</div>
        <textarea class="notes-input" placeholder="What worked? What was hard? Links to your repos, papers you read, decisions you made…" onchange="saveNote(${phase.id}, this.value)">${noteVal}</textarea>
      </div>
    </div>
  </div>`;
}

// ── Init ──
document.getElementById('phases-container').innerHTML = PHASES.map(renderPhase).join('');
updateStats();

// Open current active phase
const cp = getCurrentPhase();
togglePhase(cp.id);
</script>
</body>
</html>
